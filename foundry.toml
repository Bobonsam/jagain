[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true
optimizer = true
optimizer_runs = 200
remappings = [
    "@uniswap/v2-core/=lib/v2-core/",
    "@uniswap/lib/=lib/uniswap-lib/",
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md
